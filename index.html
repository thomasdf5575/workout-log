<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FE0">
<title>Workout Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-screen phone app — sticky header, scrolling main, fixed bottom tab bar. Cool steel neutrals, cobalt accent, condensed signage face. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#121820; --muted:#5A6573; --line:#D3D9E0;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E1E8FC;
  --good:#1D8049; --good-soft:#DDF1E5; --warn:#A35F00; --warn-soft:#FBEBD2; --bad:#BE3027;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#161C23; --sunk:#11161C; --ink:#E7EBEF; --muted:#93A0AE; --line:#27303A;
    --accent:#7392FF; --accent-ink:#0A1024; --accent-soft:#1B2543;
    --good:#4CC17D; --good-soft:#15301F; --warn:#E3A24A; --warn-soft:#33260F; --bad:#F06A60; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#161C23; --sunk:#11161C; --ink:#E7EBEF; --muted:#93A0AE; --line:#27303A;
  --accent:#7392FF; --accent-ink:#0A1024; --accent-soft:#1B2543;
  --good:#4CC17D; --good-soft:#15301F; --warn:#E3A24A; --warn-soft:#33260F; --bad:#F06A60; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
header .status{font-size:13px;color:var(--muted);text-align:right}
main{flex:1;overflow-y:auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0;letter-spacing:.02em}
.lbl{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.field{display:flex;flex-direction:column}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.sm{padding:4px 10px;min-height:30px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.dur{display:flex;align-items:center;gap:12px}
.dur output{font-family:var(--display);font-weight:700;font-size:24px;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.actrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.actrow:first-of-type{border-top:0}
/* week bars */
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.bars .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bars .f{height:100%;background:var(--accent);border-radius:5px}
.bars .n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4ch;text-align:right}
.bars .f.low{background:var(--warn)}
/* plan */
.plan-ex{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.plan-ex .num{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);line-height:1}
.plan-ex .spec{font-variant-numeric:tabular-nums;font-weight:600}
.callout{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:15px}
.spinner{width:18px;height:18px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
/* log */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-head b{font-size:17px}
.ex.done{opacity:.55;background:var(--sunk)} .ex.done .ex-head b::after{content:" ✓ Complete";font-size:13px;font-weight:600;color:var(--good)}
.hint{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.hint strong{color:var(--ink)}
.hint.stall{background:var(--warn-soft)}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 4px 4px}
.sets td{padding:3px 4px}
.sets td:first-child{width:34px;font-weight:600;color:var(--muted);text-align:center}
.sets input{min-height:44px;text-align:center;padding:8px 4px}
.sets td:last-child{width:52px}
.sets select.rir{min-height:44px;width:58px;padding:8px 2px;text-align:center}
.sets abbr{text-decoration:none}
.check{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;display:grid;place-items:center}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pr{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;background:var(--accent);color:#fff;vertical-align:middle}
.sets td:first-child .pr{display:block;margin:2px auto 0;width:max-content}
.check svg{width:20px;height:20px}
.block{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.block.str{background:var(--surface)} .block.str .plan-ex:first-of-type{border-top:0}
.block.wod{background:var(--accent-soft)}
.wod-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.clock{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
.clock .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.clock .sub{font-weight:600;color:var(--muted);text-align:center;min-height:1.3em}
.clock.work .big{color:var(--accent)} .clock.rest .big{color:var(--muted)}
/* history */
.sess{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.sess:first-of-type{border-top:0;padding-top:0}
.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.sess summary::-webkit-details-marker{display:none}
.kv{font-variant-numeric:tabular-nums}
.exlist{display:flex;flex-direction:column}
.exlist button{background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.exlist button:first-child{border-top:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:19px;font-family:var(--body)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.done-hero{text-align:center}
.done-title{font-size:30px;margin:4px 0 2px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tile{background:var(--accent-soft);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .5s ease-out both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}.tile:nth-child(5){animation-delay:.32s}
.tile b{font-size:24px;font-variant-numeric:tabular-nums}.tile span{font-size:13px;color:var(--muted)}
.prs{text-align:left;display:flex;flex-direction:column;gap:6px}
.done-bars .t{position:relative;display:flex;height:14px}
.done-bars .f{border-radius:0}.done-bars .f.base{opacity:.45}
.done-bars .f.add{background:var(--good);transition:width 1.1s cubic-bezier(.2,.8,.2,1) .2s}
.done-bars .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.done-bars .plus{color:var(--good);font-weight:700}.done-bars .hit{color:var(--good);font-weight:700}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.done-title,.tile{animation:none}.done-bars .f.add{transition:none}}
.emph{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:90%;text-align:center}
.prof{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.xbtn{flex:none;min-width:44px;min-height:44px;font-size:18px;padding:0}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<div class="app">
  <header><h1>Workout Log</h1><div class="status" id="status">Loading…</div></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------------- Reference data ---------------- */
const MUSCLES = ["chest","back","shoulders","biceps","triceps","forearms","quads","hamstrings","glutes","calves","core"];
const EQUIP = {barbell:"Barbell & rack",trapbar:"Trap bar",dumbbell:"Dumbbells",bench:"Bench",machine:"Machines",cable:"Cable stack",bars:"Pull-up / dip bars",kettlebell:"Kettlebell",bands:"Bands",
  rower:"Rower",bike:"Air bike",ski:"Ski machine",rope:"Jump rope",box:"Plyo box",rings:"Rings",wallball:"Wall ball",sandbag:"Sandbag",sled:"Sled",climb:"Climbing rope",ghd:"GHD",run:"Can run outside"};
const EQUIP_STRENGTH=["barbell","trapbar","dumbbell","bench","machine","cable","bars","kettlebell","bands"];
// Equipment whose available weights can be set per location. kind: list = specific weights or ranges,
// plates = bar + smallest plate, stack = machine step. step = default step for ranges like "4-16".
const WEIGHTED = {barbell:{kind:"plates",bar:20},trapbar:{kind:"plates",bar:25},dumbbell:{kind:"list",step:2,ph:"e.g. 2-40"},kettlebell:{kind:"list",step:4,ph:"e.g. 20 or 8-24"},
  wallball:{kind:"list",step:1,ph:"e.g. 6, 9"},sandbag:{kind:"list",step:5,ph:"e.g. 20, 40"},machine:{kind:"stack",step:5},cable:{kind:"stack",step:2.5}};
// Which implement sets the weight for an exercise (first match wins).
const LOAD_ORDER=["barbell","trapbar","dumbbell","kettlebell","wallball","sandbag","machine","cable","sled"];
const loadKind=info=>info?LOAD_ORDER.find(k=>info.eq.includes(k))||null:null;
// Available weights at a location for one implement: sorted list of kg, or null if not set (assume a typical gym).
function availList(prof,key){
  const cfg=WEIGHTED[key], w=prof&&prof.w&&prof.w[key]; if(!cfg||!w) return null;
  if(cfg.kind==="plates"){const bar=num(w.bar)||cfg.bar||20, plate=num(w.plate)||0; if(!plate) return null; const out=[];for(let x=bar;x<=bar+400;x+=2*plate)out.push(Math.round(x*100)/100);return out;}
  if(cfg.kind==="stack"){const st=num(w.step);if(!st)return null;const out=[];for(let x=st;x<=300;x+=st)out.push(Math.round(x*100)/100);return out;}
  const step=num(w.step)||cfg.step, out=new Set();
  String(w.spec||"").split(/[,;]/).forEach(part=>{const m=part.trim().match(/^(\d+(?:[.,]\d+)?)\s*(?:-|–|to)\s*(\d+(?:[.,]\d+)?)$/);
    if(m){let a=num(m[1]),b=num(m[2]);if(a>b)[a,b]=[b,a];for(let x=a;x<=b+1e-9&&out.size<200;x+=step)out.add(Math.round(x*100)/100);}
    else if(num(part)>0) out.add(num(part));});
  return out.size?[...out].sort((a,b)=>a-b):null;
}
function availText(prof,key){
  const cfg=WEIGHTED[key], w=prof&&prof.w&&prof.w[key]; if(!cfg||!w) return "";
  if(cfg.kind==="plates") return num(w.plate)?`${num(w.bar)||cfg.bar||20} kg bar, loads in ${2*num(w.plate)} kg jumps`:"";
  if(cfg.kind==="stack") return num(w.step)?`stack in ${num(w.step)} kg steps`:"";
  const l=availList(prof,key); if(!l) return "";
  return l.length<=8?`${l.join(", ")} kg`:`${l[0]}–${l[l.length-1]} kg in ${num(w.step)||cfg.step} kg steps`;
}
// Nearest available weight (mode: "near" | "up" = smallest above w | "down" = largest at or below w).
// Returns w unchanged when the location has no list for that implement; null when nothing fits "up".
function snapW(prof,info,w,mode="near"){
  const key=loadKind(info), l=key?availList(prof,key):null; if(!l||!(w>0)) return w;
  if(mode==="up"){const x=l.find(v=>v>w+1e-9);return x===undefined?null:x;}
  if(mode==="down"){const c=l.filter(v=>v<=w+1e-9);return c.length?c[c.length-1]:l[0];}
  return l.reduce((a,b)=>Math.abs(b-w)<Math.abs(a-w)?b:a);
}
// Location used for suggestions: the workout being logged, else the one picked on the Plan tab.
const curProf=()=>profileByid(S.draft&&S.draft.where?S.draft.where:S.gen&&S.gen.where);
// name | main muscles (1-3) | assisting muscles | equipment (all required) | type: c=compound i=isolation b=bodyweight t=timed
// Optional: | use (s=strength, c=conditioning, b=both) | unit (reps, cal, m, s) | pattern | skill (basic, intermediate, advanced) | easier version
const LIB_RAW = `Barbell bench press|chest|triceps,shoulders|barbell bench|c

/* ---------------- Training logic ---------------- */
function exHistory(name){
  const n=norm(name),out=[];
  for(const s of sortedSessions()){const e=(s.exercises||[]).find(x=>norm(x.name)===n);if(e&&e.sets&&e.sets.some(t=>t.r>0))out.push({id:s.id,savedAt:s.savedAt,date:s.date,deload:!!s.deload,sets:e.sets.filter(t=>t.r>0)});}
  return out;
}
// Personal records. Best results for an exercise in sessions before the given one
// (earlier date, or same date and saved earlier). A set is a record if it is the heaviest weight
// ever, a higher estimated 1RM (sets of 12 reps or fewer, where the formula is reliable), or,
// for bodyweight work, more reps than ever.
function bestBefore(name,date,id,savedAt){
  const n=norm(name),b={any:false,maxW:0,maxE:0,maxR:0};
  for(const s of S.sessions){
    if(s.id===id) continue;
    if(!(s.date<date||(s.date===date&&(s.savedAt||0)<(savedAt||Infinity)))) continue;
    for(const e of s.exercises||[]){if(norm(e.name)!==n)continue;
      for(const t of e.sets||[]){const w=num(t.w),r=num(t.r);if(!(r>0))continue;b.any=true;
        if(w>b.maxW)b.maxW=w; if(w>0&&r<=12)b.maxE=Math.max(b.maxE,e1rm(w,r)); if(w===0)b.maxR=Math.max(b.maxR,r);}}
  }
  return b;
}
function isPR(t,b){
  if(!b.any) return false; const w=num(t.w),r=num(t.r); if(!(r>0)) return false;
  if(w>0) return w>b.maxW||(r<=12&&e1rm(w,r)>b.maxE+0.01);
  return b.maxW===0&&r>b.maxR;
}
// The single best set of an exercise in one session: highest estimated 1RM (Epley, up to 12 reps),
// else heaviest weight; bodyweight-only by reps. Only that set can be a PR, so earlier, weaker
// sets in the same session don't get the badge too.
function setScore(t){const w=num(t.w),r=num(t.r);if(!(r>0))return -1;return w>0?(r<=12?e1rm(w,r):w)+1e6:r;}
function prSetIndex(sets,b){let bi=-1,bs=-1;(sets||[]).forEach((t,j)=>{const sc=setScore(t);if(sc>bs||(sc===bs&&num(t.w)>num(sets[bi].w))){bs=sc;bi=j;}});return bi>=0&&isPR(sets[bi],b)?bi:-1;}
const sessPRs=s=>(s.exercises||[]).filter(e=>{const b=bestBefore(e.name,s.date,s.id,s.savedAt);return (e.sets||[]).some(t=>isPR(t,b));}).map(e=>e.name);
// Double progression: hit the top of the rep range on every working set -> add one increment.
function baselineFor(name){
  const n=norm(name), info=libFor(name), bwOk=info&&(info.type==="b"||info.type==="t");
  return (S.settings.baselines||[]).find(b=>norm(b.name)===n&&num(b.r)>0&&(num(b.w)>0||bwOk));
}
// Before any log exists: start a bit below the entered set (about 2 reps in reserve at the bottom of the range).
function baselineHint(name){
  const b=baselineFor(name); if(!b) return null;
  const info=libFor(name); const [lo,hi]=rangeOf(info); const w=num(b.w), r=Math.round(num(b.r)); const unit=info&&info.type==="t"?"s":"";
  if(w===0) return {date:null,baseline:true,lastText:`${r}${unit} (starting number)`,next:{w:0,reps:`${Math.max(1,Math.round(r*0.8))}${unit}+`},why:"Based on your starting number, a little below your best",stalled:false};
  const step=incOf(info); const tw=snapW(curProf(),info,Math.max(step,Math.floor(e1rm(w,r)/(1+(lo+2)/30)/step)*step),"down");
  return {date:null,baseline:true,lastText:`${fmtKg(w)} kg × ${r} (starting number)`,next:{w:Math.round(tw*100)/100,reps:`${lo}–${hi}`},why:"Worked out from your starting number, leaving about 2 reps in reserve",stalled:false};
}
function hintFor(name){
  const h=exHistory(name); if(!h.length) return baselineHint(name);
  const info=libFor(name); const [lo,hi]=rangeOf(info); const unit=info&&info.type==="t"?"s":"";
  const ws=h[0].sets; const topW=Math.max(...ws.map(s=>num(s.w)));
  const atTop=ws.filter(s=>num(s.w)===topW);
  let next,why;
  // Going up: the next available weight at this location; if there is none, progress reps, then sets.
  const prof=curProf(), lk=loadKind(info);
  // Smallest available weight at least one increment up; else any heavier one; else null.
  const goUp=why0=>{const target=Math.round((topW+incOf(info))*100)/100, x=snapW(prof,info,target-0.001,"up");
    const up=x===target-0.001?target:x!==null?x:snapW(prof,info,topW,"up");
    if(up===null){next={w:topW,reps:`${hi}+`};why=`No heavier ${(EQUIP[lk]||"weight").toLowerCase()} at ${prof.name}: add reps above ${hi}, then add a set`;}
    else{next={w:up,reps:`${lo}–${hi}`};why=why0;}};
  // Last weight isn't available here (e.g. logged at another gym): use the nearest one and adjust reps.
  if(topW>0){const hw=snapW(prof,info,topW,"down");
    if(hw!==topW){next={w:hw,reps:hw<topW?`${hi}+`:`${lo}–${hi}`};why=`${fmtKg(topW)} kg isn't available at ${prof.name}: use ${fmtKg(hw)} kg and ${hw<topW?"do more reps":"aim for the bottom of the range"}`;}}
  if(next){}
  else if(topW===0){
    const minR=Math.min(...atTop.map(s=>s.r));
    if(minR>=hi){next={w:0,reps:`${hi}${unit}+`};why="Top of the range: add load or a harder variation";}
    else{next={w:0,reps:`${minR+1}${unit}+`};why="Add a rep per set";}
  }else if(atTop.every(s=>s.r>=hi)){
    goUp(`All sets hit ${hi}: go up one step`);
  }else if(expOf(S.settings)==="beginner"&&atTop.every(s=>s.r>=Math.ceil((lo+hi)/2))&&!atTop.some(s=>s.rir!=null&&s.rir!==""&&num(s.rir)===0)){
    goUp(`All sets reached ${Math.ceil((lo+hi)/2)}: as a beginner, go up one step`);
  }else if(atTop.every(s=>s.r>=lo&&s.rir!=null&&s.rir!==""&&num(s.rir)>=3)){
    goUp("Every set felt easy (3+ reps left): go up one step");
  }else if(atTop.some(s=>s.r<lo)){
    const prev=h[1]; const prevMiss=prev&&prev.sets.some(s=>num(s.w)===topW&&s.r<lo);
    if(prevMiss){next={w:snapW(prof,info,Math.max(0,roundTo(topW*0.9,incOf(info)/2||0.5)),"down"),reps:`${lo}–${hi}`};why="Missed the range twice: drop about 10% and rebuild";}
    else{next={w:topW,reps:`${lo}–${hi}`};why="Below the range: repeat this weight";}
  }else{next={w:topW,reps:`${lo}–${hi}`};why="Same weight, add a rep where you can";}
  const best=h.slice(0,4).map(x=>Math.max(...x.sets.map(s=>e1rm(num(s.w),s.r))));
  const stalled=best.length>=4&&Math.max(best[0],best[1],best[2])<=best[3];
  if(stalled) why+=". No progress in 3 sessions: consider a lighter week or a variation";
  return {date:h[0].date,lastText:fmtSets(ws),next,why,stalled};
}
/* ---- Conditioning workouts (wod) ---- */
const fmtClock=sec=>{sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;};
function wodTitle(w){
  if(!w) return "";
  return w.format==="amrap"?`AMRAP ${w.minutes} min`:w.format==="emom"?`EMOM ${w.minutes} min`:w.format==="intervals"?`${w.rounds} × ${w.workSec}s on / ${w.restSec}s off`
    :w.format==="chipper"?`Chipper, ${w.minutes} min cap`:`${w.rounds>1?w.rounds+" rounds for time":"For time"}, ${w.minutes} min cap`;
}
const unitTxt=u=>u==="cal"?" cal":u==="m"?" m":u==="s"?" s":"";
function moveText(m,scaled){const x=scaled&&m.scaled?m.scaled:m;return `${x.reps?x.reps+unitTxt(m.unit)+" ":""}${x.name}${x.weight?` @ ${fmtKg(x.weight)} kg`:""}`;}
// What kind of score a format produces: time (for time, chipper) or rounds (amrap, emom, intervals).
const scoreKind=w=>w&&(w.format==="fortime"||w.format==="chipper")?"time":"rounds";
function scoreText(s){
  const sc=s.score||{}, w=s.wod; if(!w) return "";
  let t= scoreKind(w)==="time"&&!sc.capped&&sc.time>0 ? fmtClock(sc.time)
    : sc.rounds!=null&&sc.rounds!==""? `${num(sc.rounds)} round${num(sc.rounds)===1?"":"s"}${num(sc.reps)?` + ${num(sc.reps)}`:""}${sc.capped?" (capped)":""}` : "";
  if(!t) return "";
  return `${t} · ${s.rx===false?"scaled":"as written"}${s.effort?` · effort ${s.effort}/10`:""}`;
}
// Rounds of movement i actually done, used for the ½-set volume count.
function wodRoundsFor(s,i){
  const w=s.wod, sc=s.score||{}, n=(w.movements||[]).length||1;
  if(w.format==="amrap") return Math.floor(num(sc.rounds));
  if(w.format==="fortime") return sc.capped?Math.floor(num(sc.rounds)):(w.rounds||1);
  if(w.format==="chipper") return 1;
  const total=w.format==="emom"?w.minutes:(w.rounds||0);
  const done=sc.rounds!=null&&sc.rounds!==""?Math.min(total,Math.floor(num(sc.rounds))):total;
  return Math.floor(done/n)+(i<done%n?1:0);
}
// Muscles worked by a saved conditioning workout: each round of a weighted movement = ½ set (¼ for assisting muscles).
function wodVolume(s,add){
  if(!s.wod||!Array.isArray(s.wod.movements)) return;
  s.wod.movements.forEach((m,i)=>{const w=s.rx===false&&m.scaled?m.scaled.weight:m.weight;const r=wodRoundsFor(s,i);
    if(!(w>0)||!(r>0)) return; (m.muscles||[]).forEach(x=>add(x,r/2)); (m.secondary||[]).forEach(x=>add(x,r/4));});
}
function weekVolume(){
  const v={};MUSCLES.forEach(m=>v[m]=0);const cut=addDays(todayISO(),-6);
  for(const s of S.sessions){if((s.date||"")<cut)continue;for(const e of s.exercises||[]){const n=(e.sets||[]).filter(t=>t.r>0).length;const mm=musclesOf(e);mm.primary.forEach(m=>v[m]+=n);mm.secondary.forEach(m=>v[m]+=n/2);}
    wodVolume(s,(m,x)=>{if(v[m]!==undefined)v[m]+=x;});}
  return v;
}
function daysSince(){
  const d={};const t=todayISO();const mark=(m,n)=>{if(!MUSCLES.includes(m))return;if(d[m]===undefined||n<d[m])d[m]=n;};
  for(const s of S.sessions){const n=daysBetween(s.date,t);for(const e of s.exercises||[]){const mm=musclesOf(e);[...mm.primary,...mm.secondary].forEach(m=>mark(m,n));}
    if(s.wod)(s.wod.movements||[]).forEach(m=>[...(m.muscles||[]),...(m.secondary||[])].forEach(x=>mark(x,n)));}
  for(const a of otherActs(35)) (ACT_MUSCLES[actKind(a)]||[]).forEach(m=>mark(m,daysBetween(actDate(a),t)));
  return d;
}
// Consecutive weeks (7-day blocks back from today) with at least one session, stopping at a
// week with no training or at the last lighter (deload) session. Used to suggest deloads.
function trainingBlock(){
  const t=todayISO(); let weeks=0, lastDeload=null;
  const ss=sortedSessions(); const dl=ss.find(s=>s.deload); if(dl) lastDeload=dl.date;
  for(let k=0;k<52;k++){
    const hi=addDays(t,-7*k), lo=addDays(t,-7*k-6);
    const wk=ss.filter(s=>s.date>=lo&&s.date<=hi);
    if(!wk.length||wk.some(s=>s.deload)) break;

  }
  return {weeks,lastDeload};
}
function profileByid(id){return S.settings.profiles.find(p=>p.id===id)||S.settings.profiles[0];}
function availableExercises(prof){return LIB.filter(x=>x.eq.every(q=>prof.eq.includes(q)));}

/* ---------------- Garmin ----------------
   The garmin-sync Edge Function pulls recent Garmin Connect data into garmin_days and

S.garmin={days:{},acts:[],busy:false,status:"",tryAt:0};
const garminOn=()=>!!(S.settings.garmin&&S.settings.garmin.enabled);
const GARMIN_ERR={
  garmin_not_configured:"The GARMIN_API_KEY secret isn't set in Supabase yet.",
  garmin_key_rejected:"Garmin rejected the key. It may have expired or been deleted: create a new one and update the GARMIN_API_KEY secret.",
  not_allowed:"This account isn't on the list allowed to use the Garmin sync.",
  not_signed_in:"Your sign-in has expired. Sign out and back in.",
  not_deployed:"The garmin-sync function isn't deployed in Supabase yet.",

function saveGarminCache(){if(user){const g=S.garmin;ls.set(k("garmin"),{days:g.days,acts:g.acts,syncAt:g.syncAt,profile:g.profile,status:g.status,counts:g.counts});}}
function loadGarminCache(){const c=ls.get(k("garmin"))||{};S.garmin={days:{},acts:[],...c,busy:false,tryAt:0};}
async function loadGarmin(){
  if(!sb||!user||!navigator.onLine) return;
  const since=addDays(todayISO(),-34);
  const [d,a]=await Promise.all([
    sb.from("garmin_days").select("day,data").gte("day",since).limit(100),
    sb.from("garmin_activities").select("id,start,data").gte("start",since+"T00:00:00Z").order("start",{ascending:false}).limit(300)
  ]);
  if(d.error||a.error) throw new Error("save_failed");
  S.garmin.days=Object.fromEntries(d.data.map(r=>[r.day,r.data]));

// Sync when the app opens, when it comes back to the foreground and before a plan; at most every 15 minutes.
async function garminSync(force){
  const g=S.garmin;
  if(!garminOn()||!sb||!user||!navigator.onLine||g.busy) return;
  const quick=force==="quick"; if(quick) force=false;
  if(!quick&&!force&&Date.now()-Math.max(g.syncAt||0,g.tryAt||0)<15*60000) return;
  if(quick&&Date.now()-(g.tryAt||0)<60000) return;
  g.busy=true;g.tryAt=Date.now();softRender();
  try{
    const {data,error}=await sb.functions.invoke("garmin-sync",{body:{today:todayISO(),days:quick?3:force||!g.syncAt?28:7}});
    if(error){let code="sync_failed";try{if(error.context&&error.context.status===404)code="not_deployed";const b=await error.context.json();code=b.error||code;}catch(e){}throw new Error(code);}
    g.syncAt=Date.now();g.profile=data.profile||g.profile;g.counts={days:data.days,activities:data.activities};
    const missing=Object.keys(data.errors||{});
    g.status=missing.length?`Synced, but Garmin didn't return: ${missing.join(", ")}.`:"";
    await loadGarmin(); autoLink();
  }catch(e){console.error(e);g.status=GARMIN_ERR[e.message]||"Couldn't reach Garmin. The app works as usual without it.";}

function softRender(){const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")){renderNav();renderStatus();return;}if(S.mode==="ready")render();}
function garminKeyDays(){const e=S.settings.garmin&&S.settings.garmin.keyExpires;return garminOn()&&e?daysBetween(todayISO(),e):null;}
function agoText(ts){const m=Math.round((Date.now()-ts)/60000);return m<1?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`;}
const durText=sec=>{const m=Math.round((sec||0)/60);return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`:`${m} min`;};

/* Readiness from Garmin (rules R1-R4, R6, R8, R9). Points per signal; a missing signal counts 0.
   R1 sleep: <6 h or score <60 → -1; ≥7.5 h and score ≥80 → +1.  R2 HRV below baseline / LOW / UNBALANCED → -1.
   R3 resting HR vs the previous 7 days' average: +5 → -1, +8 → -2.  R4 Body Battery at wake: <40 → -1, ≥75 → +1.

function readinessFor(day){
  const g=S.garmin.days||{}, x=g[day]; if(!x) return null;
  const sig=[]; const add=(pts,txt)=>sig.push({pts,txt});
  if(x.sleepSec>0){const h=x.sleepSec/3600, sc=x.sleepScore;

/* Linking watch activities to logged sessions (rules L1-L6, Q5).
   L1 Strength → strength part (from workout start), Cardio/HIIT → WOD part (from the WOD clock).
   L2 same date, start within 15 min.  L3 a hybrid can link both.  L4 a hybrid with only one
   activity links it to the whole session.  L5 one match links automatically, several or none
   → the session offers a picker; auto-linking keeps trying for 24 h.  L6 WOD heart rate goes to the AI. */
const isStrengthAct=a=>/strength/.test(String(a.type||"").toLowerCase());
const isWodAct=a=>/cardio|hiit/.test(String(a.type||"").toLowerCase());
const actMs=a=>Date.parse(a.start)||0;
function actSnap(a){const o={id:a.id,type:a.type,name:a.name||"",start:a.start};["sec","avgHr","maxHr","kcal","te","teAn","zones"].forEach(f=>{if(a[f]!=null)o[f]=a[f];});return o;}
function linkedIds(){const ids=new Set();for(const x of S.sessions){const g=x.garmin||{};["strength","wod","whole"].forEach(p=>{if(g[p])ids.add(g[p].id);});}return ids;}
const isHybrid=x=>!!(x.wod&&(x.exercises||[]).length);
function sessParts(x){
  const t0=x.t0||null, w0=x.wodStart||null;
  if(isHybrid(x)) return [{part:"strength",start:t0,fit:isStrengthAct},{part:"wod",start:w0||t0,fit:isWodAct}];
  return x.wod?[{part:"wod",start:w0||t0,fit:isWodAct}]:[{part:"strength",start:t0,fit:isStrengthAct}];
}
// Candidate activities for each part (unlinked, same date, within 15 min of the part's start).
function linkCands(x){
  const taken=linkedIds(), acts=(S.garmin.acts||[]).filter(a=>actDate(a)===x.date&&!taken.has(a.id));
  return sessParts(x).map(p=>({...p,cands:p.start?acts.filter(a=>p.fit(a)&&Math.abs(actMs(a)-p.start)<=15*60000):[]}));
}
function autoLink(){
  if(!garminOn()) return; let changed=false;
  for(const x of S.sessions){
    if(!x.t0||Date.now()-(x.savedAt||0)>24*3600000) continue;
    const g=x.garmin||{}; if(g.strength&&g.wod) continue; if(!isHybrid(x)&&(g.strength||g.wod||g.whole)) continue;
    const parts=linkCands(x); let ng=null;
    if(parts.some(p=>p.cands.length>1)) continue; // several matches: the session offers a picker
    if(!isHybrid(x)){const a=parts[0].cands[0];if(a)ng={[parts[0].part]:actSnap(a)};}
    else{
      let sa=parts[0].cands[0]?actSnap(parts[0].cands[0]):null, wa=parts[1].cands[0]?actSnap(parts[1].cands[0]):null;
      if(g.whole){if(isWodAct(g.whole))wa=g.whole;else sa=g.whole;}
      if(!sa&&!wa&&!g.whole){ // L4: one activity of either type started with the workout
        const taken=linkedIds(), any=(S.garmin.acts||[]).filter(a=>actDate(a)===x.date&&!taken.has(a.id)&&(isStrengthAct(a)||isWodAct(a))&&Math.abs(actMs(a)-x.t0)<=15*60000);
        if(any.length===1) ng={whole:actSnap(any[0])};
      }
      else if(sa&&wa) ng={strength:sa,wod:wa};
      else if(!g.whole) ng={whole:sa||wa};
    }
    if(ng){x.garmin=ng;saveSession(x);changed=true;}
  }
  if(changed) softRender();
}
// Manual picker: activities on that date not linked elsewhere.
function pickCands(x){const taken=linkedIds();return (S.garmin.acts||[]).filter(a=>actDate(a)===x.date&&!taken.has(a.id)).sort((a,b)=>actMs(a)-actMs(b));}
function linkManual(x,a){
  const g={...(x.garmin||{})};

  else{
    if(g.whole){const w=g.whole;delete g.whole;if(isStrengthAct(w)||!isWodAct(w))g.strength=w;else g.wod=w;}
    const part=isWodAct(a)?(g.wod?"strength":"wod"):(g.strength?"wod":"strength");
    g[part]=actSnap(a);

}
function snapText(a){return [durText(a.sec),a.avgHr?`avg HR ${a.avgHr}`:"",a.maxHr?`max ${a.maxHr}`:"",a.kcal?`${a.kcal} kcal`:"",a.te?`TE ${Number(a.te).toFixed(1)}`:""].filter(Boolean).join(" · ");}

function beep(kind){
  const plan=kind==="end"?[[1320,.35,0],[1320,.35,.5],[1320,.6,1]]:kind==="long"?[[1320,.5,0]]:[[880,.12,0]];
  if(audioCtx) plan.forEach(([f,d,at])=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t0=audioCtx.currentTime+at;
    o.frequency.value=f;o.type="square";g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);

function wodTotal(w){return w.format==="intervals"?w.rounds*(w.workSec+w.restSec):w.minutes*60;}
// Current display and the cue (beep) for this moment.
function clockState(d){
  const w=d.wod, c=d.clock||{};
  if(!c.start) return {phase:"idle",big:w.format==="amrap"||w.format==="emom"?fmtClock(w.minutes*60):w.format==="intervals"?fmtClock(w.workSec):"0:00",sub:"Tap Start: 10 s countdown, then go",cls:""};
  const t=(Date.now()-c.start)/1000-LEAD, total=wodTotal(w), n=w.movements.length;
  if(c.ended||t>=total){const done=c.doneAt!=null?c.doneAt:Math.min(t,total);
    return {phase:"end",big:scoreKind(w)==="time"&&d.score&&d.score.time>0?fmtClock(d.score.time):"Time",sub:scoreKind(w)==="time"&&!(d.score&&d.score.time>0)?"Time cap reached: enter rounds and reps below":"Finished: check your score below",cls:"",cue:"end",t:done};}
  if(t<0){const sec=Math.ceil(-t);return {phase:"countdown",big:String(sec),sub:"Get ready",cls:"rest",cue:sec<=3?"c"+sec:null,t};}
  const last3=(left,key)=>left<=3&&left>0?key+Math.ceil(left):null;
  if(w.format==="amrap") return {phase:"run",big:fmtClock(total-t),sub:`Rounds: ${c.rounds||0}`,cls:"work",cue:t<1?"go":last3(total-t,"a"),t};
  if(w.format==="emom"){const k=Math.floor(t/60), left=60-t%60, m=w.movements[k%n];
    return {phase:"run",big:fmtClock(left),sub:`Minute ${k+1}/${w.minutes}: ${moveText(m,d.rx===false)}`,cls:"work",cue:t%60<1?"M"+k:last3(left,"m"+k+"-"),t};}
  if(w.format==="intervals"){const per=w.workSec+w.restSec, k=Math.floor(t/per), into=t%per, m=w.movements[k%n], work=into<w.workSec;
    const left=work?w.workSec-into:per-into, next=w.movements[(k+1)%n];
    return {phase:"run",big:fmtClock(left),sub:work?`Round ${k+1}/${w.rounds} · Work: ${moveText(m,d.rx===false)}`:`Rest · next: ${k+1<w.rounds?moveText(next,d.rx===false):"done"}`,cls:work?"work":"rest",
      cue:into<1?"W"+k:(!work&&into-w.workSec<1)?"R"+k:last3(left,(work?"w":"r")+k+"-"),t};}
  return {phase:"run",big:fmtClock(t),sub:`Time cap ${fmtClock(total)}`,cls:"work",cue:t<1?"go":last3(total-t,"f"),t};
}
const cueSound=cue=>!cue?null:cue==="end"?"end":/^(go|M|W)/.test(cue)?"long":/^R/.test(cue)?"long":"short";
function stopClockTick(){clearInterval(clockI);clockI=null;lastCue=null;}
function tickClock(){
  const d=S.draft; if(!d||!d.wod||!d.clock||!d.clock.start||d.clock.ended){stopClockTick();return;}
  const st=clockState(d);
  if(st.cue&&st.cue!==lastCue){lastCue=st.cue;beep(cueSound(st.cue));}
  if(st.phase==="end"){finishClock(false);return;}
  if($("#clock")&&st.phase!==clockPhaseShown){render();return;}
  const b=$("#clockBig"),u=$("#clockSub"),c=$("#clock");if(b)b.textContent=st.big;if(u)u.textContent=st.sub;if(c)c.className="clock "+st.cls;

// End of the clock: by the Done button (for time), the stop button, or time running out.
function finishClock(byDone){
  const d=S.draft, c=d.clock, w=d.wod, t=Math.max(0,(Date.now()-c.start)/1000-LEAD), total=wodTotal(w);

  if(scoreKind(w)==="time"){ if(byDone&&t<total){d.score.time=Math.round(t);d.score.capped=false;} else if(t>=total){d.score.capped=true;} }
  else if(w.format==="amrap") d.score.rounds=String(c.rounds||0);
  else { const per=w.format==="emom"?60:w.workSec+w.restSec; d.score.rounds=String(Math.min(w.format==="emom"?w.minutes:w.rounds,Math.floor(t/per))); }

  stopClockTick();saveDraftSoon();render();
}

/* ---------------- Keep the screen on during a workout ----------------
   The browser drops the lock when the app is hidden, so it is re-requested on return. */
let wakeLock=null, wakeBusy=false;
async function syncWakeLock(){
  if(!("wakeLock" in navigator)||wakeBusy) return;
  const want=!!S.draft&&!S.draft.editing&&S.mode==="ready"&&document.visibilityState==="visible";
  wakeBusy=true;
  try{
    if(want&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;});}
    else if(!want&&wakeLock){const l=wakeLock;wakeLock=null;await l.release();}
  }catch(e){wakeLock=null;} // e.g. battery saver: not critical
  finally{wakeBusy=false;}
}
document.addEventListener("visibilitychange",syncWakeLock);

function confetti(n){

  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.018,vy:-Math.random()*H*.022-H*.006,s:(4+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));

function viewExercise(name){

    const days=daysBetween(pts[0].date,pts[pts.length-1].date);
    stats=`<div class="row" style="gap:18px"><div><p class="lbl" style="margin:0">${bw?"Latest best set":"Latest est. 1RM"}</p><b style="font-size:22px">${fmtV(cur)} ${unit}</b></div><div><p class="lbl" style="margin:0">Best</p><b style="font-size:22px">${fmtV(best)} ${unit}</b></div>${pts.length>1&&first>0?`<div><p class="lbl" style="margin:0">Change</p><b style="font-size:22px">${cur>=first?"+":""}${Math.round(100*(cur-first)/first)}%</b><span class="muted small"> in ${days<14?days+" days":Math.round(days/7)+" weeks"}</span></div>`:""}</div>`;
  }
  if(pts.length>=2){
    const W=560,H=260,L=56,R=12,T=14,B=34;const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){hi+=1;lo-=1;}const pad=(hi-lo)*0.15;lo=Math.max(0,lo-pad);hi+=pad;
    const span=Math.max(1,daysBetween(pts[0].date,pts[pts.length-1].date));
    const x=p=>L+(W-L-R)*daysBetween(pts[0].date,p.date)/span;const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
    const ticks=[lo,(lo+hi)/2,hi];

    const area=line+`L${x(pts[pts.length-1]).toFixed(1)},${H-B}L${x(pts[0]).toFixed(1)},${H-B}Z`;
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${bw?"Best reps":"Estimated one-rep max"} over time for ${esc(name)}">

const PRICES={"claude-sonnet-5-5":[2,10],"claude-sonnet-5":[2,10],"claude-haiku-5-5":[0.1,0.5],"claude-opus-5-5":[4,20]}; // $ per million tokens: input, output
async function loadAiUsage(){
  if(!sb||!user||!navigator.onLine||S.aiUsageBusy) return; S.aiUsageBusy=true;
  try{
    const since=new Date(Date.now()-30*864e5).toISOString();
    const {data,error}=await sb.from("ai_calls").select("model,input_tokens,output_tokens,cache_read_tokens").gte("created_at",since).limit(1000);
    if(error) throw error;
    const n=data.length, sum=k=>data.reduce((a,r)=>a+(r[k]||0),0);
    const cost=data.reduce((a,r)=>{const [pi,po]=PRICES[r.model]||PRICES["claude-sonnet-5-5"];return a+(r.input_tokens*pi+r.output_tokens*po+(r.cache_read_tokens||0)*pi*0.05)/1e6;},0);
    S.aiUsage={n,inAvg:n?Math.round(sum("input_tokens")/n):0,outAvg:n?Math.round(sum("output_tokens")/n):0,cost};
  }catch(e){S.aiUsage={error:true};}
  finally{S.aiUsageBusy=false;S.aiUsageAt=Date.now();if(S.tab==="setup"&&!S.setupPage)render();}
}
function viewAiUsage(){

  return `<section class="card"><h2>AI usage</h2><p class="muted small" style="margin:0">Last 30 days, estimated from API list prices.</p><p class="small" style="margin:0">${esc(body)}</p></section>`;
}

  <div class="field"><p class="lbl">Muscle emphasis</p><p class="muted small" style="margin:0 0 6px">Emphasize: upper half of the weekly target (${(()=>{const [a,b]=weeklyTarget(st);return `${Math.round((a+b)/2)}–${b}`;})()} sets). Maintain: about a third (${(()=>{const [a,b]=weeklyTarget(st);return `${Math.max(2,Math.round(a/3))}–${Math.max(3,Math.round(b/3))}`;})()}), enough to keep what you have.</p>
    <div class="emph">${MUSCLES.map(m=>`<span class="small">${cap(m)}</span><div class="seg">${Object.entries(EMPHASIS).map(([k,l])=>chip(l,emphOf(st,m)===k,"emph",m+"|"+k,"sm")).join("")}</div>`).join("")}</div></div>
  <div class="field"><p class="lbl">Exercise style</p><div class="seg">${Object.entries(STYLES).map(([k,l])=>chip(l,st.style===k,"style",k)).join("")}</div><p class="muted small" style="margin:6px 0 0">${st.style==="compound"?"Sessions are built around multi-joint lifts; isolation work only fills gaps.":st.style==="balanced"?"Main lifts first, then an even mix of compound and isolation work.":"One or two main lifts, then mostly isolation work."}</p></div>
  </section>`;
  h+=viewAiUsage();
  h+=`<section class="card"><h2>Your account</h2><p class="muted small" style="margin:0">Signed in as <b>${esc(user&&user.email||"")}</b>. Your log is saved to this account and synced across your devices.</p>
  ${S.confirm==="signout"?`<div class="inline-confirm"><span class="small">Some changes haven't synced yet and will be lost if you sign out now.</span><button class="btn danger" data-a="signout">Sign out anyway</button><button class="btn" data-a="confirm-no">Stay signed in</button></div>`:`<button class="btn" data-a="signout">Sign out</button>`}</section>
  <section class="card"><h2>Backup and import</h2><p class="muted small" style="margin:0">Copy a backup any time. To bring over your history from the claude.ai version, copy its backup there (Setup → Copy backup) and paste it below.</p>
  <button class="btn" data-a="export">Copy backup to clipboard</button>
  <div class="field"><label class="lbl" for="imp">Restore or import</label><textarea id="imp" placeholder="Paste a backup here"></textarea></div>
  <button class="btn" data-a="import">Import sessions from backup</button></section>`;
  return h;
}

let toastT;

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]"); if(!b) return;

    case "lib-edit": {const x=LIB.find(e=>e.name===v);if(!x)break;S.libEdit={orig:x.name,name:x.name,muscles:[...x.muscles],sec:[...x.sec],eq:[...x.eq],type:x.type||"c",use:x.use,unit:x.unit,pattern:x.pattern,skill:x.skill,easier:x.easier||""};S.confirm=null;render();$("#libCard")?.scrollIntoView({block:"start"});return;}
    case "lib-cancel": S.libEdit=null;break;
    case "setup-page": S.setupPage=v;S.confirm=null;render();$("#main").scrollTop=0;return;
    case "setup-back": S.setupPage=null;S.confirm=null;render();$("#main").scrollTop=0;return;
    case "lib-main": {const f=S.libEdit;if(f.muscles.includes(v))f.muscles=f.muscles.filter(m=>m!==v);else if(f.muscles.length>=3){toast("Up to 3 main muscles. Untick one first.");return;}else{f.muscles.push(v);f.sec=f.sec.filter(m=>m!==v);}break;}
    case "lib-sec": {const f=S.libEdit;f.sec=f.sec.includes(v)?f.sec.filter(m=>m!==v):[...f.sec,v];break;}
    case "lib-eq": {const f=S.libEdit;f.eq=f.eq.includes(v)?f.eq.filter(k=>k!==v):[...f.eq,v];break;}

      const ex=st.exLib=st.exLib||{custom:[],hidden:[]}; ex.custom=ex.custom||[]; ex.hidden=ex.hidden||[];
      const drop=new Set([norm(name),norm(f.orig||"")]);

document.addEventListener("input",ev=>{
  const t=ev.target, k=t.dataset&&t.dataset.in; if(!k) return; const st=S.settings, d=S.draft;

    case "gen-note": S.gen.note=t.value;break;

      {const pj=prSetIndex(ex.sets,bestBefore(ex.name,d.date,d.id,d.editing?d.savedAt:Infinity));ex.sets.forEach((_,jj)=>{const el=$(`#pr-${t.dataset.i}-${jj}`);if(el)el.innerHTML=jj===pj?`<span class="pr" title="Personal record">PR</span>`:"";});}break;}
    case "d-date": d.date=t.value||todayISO();saveDraftSoon();break;
    case "d-where": d.where=t.value;saveDraftSoon();break;
    case "d-note": d.note=t.value;saveDraftSoon();break;
    case "score-time": d.score.time=parseTime(t.value);saveDraftSoon();break;
    case "score-rounds": d.score.rounds=t.value.replace(/[^0-9]/g,"");saveDraftSoon();break;

    case "add-name": {S.addName=t.value;const info=libFor(t.value);if(info){const ms=cleanMains(info.muscles||[info.muscle]);if(ms.length){S.addMains=ms;S.addSec=(info.sec||[]).filter(m=>MUSCLES.includes(m)&&!ms.includes(m));$("#addMains").innerHTML=addMainChips();$("#addSec").innerHTML=addSecChips();}}break;}
    case "prof-name": st.profiles[+t.dataset.i].name=t.value;saveSettingsSoon();break;
