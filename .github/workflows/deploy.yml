# Publishes the app to GitHub Pages every time main changes.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # Only the files the browser needs. index.ts (Supabase Edge Function)
      # and schema.sql stay out of the public site.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html config.js manifest.webmanifest sw.js _site/
          cp -r icons vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      # The artifact list can lag a moment behind the upload; deploy-pages failed twice with
      # "No artifacts named github-pages" right after a successful upload. Give it time.
      - name: Wait for the artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
